# 服务列表
services:
  # 应用服务
  app:
    build: .  # 自动读取当前目录Dockerfile，构建项目镜像
    container_name: wordbook-app
    restart: always
    ports:
      - "8080:8080"
    # 依赖：先启动mysql和redis，再启动app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - GIN_MODE=release # 设置Gin框架为release模式，优化性能

  # mysql
  mysql:
    image: mysql:8.0-oracle
    container_name: wordbook-mysql
    restart: always
    
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: word_book
    
    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # redis
  redis:
    image: redis:7-alpine
    container_name: wordbook-redis
    restart: always
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# 数据卷
volumes:
  mysql-data:
  redis-data:
